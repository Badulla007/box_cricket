{% extends 'base.html' %}{% block title %}My Profile — BOUNDARY{% endblock %}{% block content %}<section class="container profile-page"><div class="eyebrow">ACCOUNT SETTINGS</div><h1>My <em>profile.</em></h1><div class="profile-card"><div class="profile-head"><span class="profile-avatar">{{ current_user.name[:1]|upper }}</span><div><h2>{{ current_user.name }}</h2><p>{{ current_user.email }} · {{ current_user.role|title }}</p></div></div><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Full name<input name="name" value="{{ current_user.name }}" required></label><label>Email address<input value="{{ current_user.email }}" disabled></label><label>Mobile number<input name="phone" value="{{ current_user.phone or '' }}"></label><button class="btn btn-primary">Save profile</button></form></div></section>{% endblock %}
